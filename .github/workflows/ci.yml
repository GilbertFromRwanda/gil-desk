name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
        working-directory: core

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # internal/rendezvous's test needs a real Docker daemon
      # (testcontainers-go) to spin up Postgres/Redis — reliably available
      # on ubuntu-latest runners, not guaranteed on windows/macos ones.
      - run: go build ./... && go vet ./...
        working-directory: backend
      - if: matrix.os == 'ubuntu-latest'
        run: go test ./...
        working-directory: backend
      - if: matrix.os != 'ubuntu-latest'
        run: go test -short ./...
        working-directory: backend

  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexdesk-codec-build codec

  # Proves the Rust<->C++ FFI boundary actually links and calls across
  # languages (Gate G0), not just that both sides build in isolation.
  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f core/Dockerfile -t nexdesk-core-ffi-verify .

  # Proves the Rust<->Node (napi-rs) boundary actually links and calls
  # across languages too (planner tasks F-18/F-19).
  napi:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash build.sh && node smoke-test.js
        working-directory: desktop/native
        shell: bash
