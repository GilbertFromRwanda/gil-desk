[package]
name = "nexdesk-core"
version.workspace = true
edition.workspace = true

[dependencies]
nexdesk-proto = { path = "../nexdesk-proto" }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
thiserror = "2"
# ring, explicitly: rustls's other supported backend (aws-lc-rs) needs cmake/nasm
# to build, which isn't guaranteed on every dev machine (see codec/ and core/ffi
# for the same reasoning applied to the C++ toolchain).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
