[package]
name = "nexdesk-core"
version.workspace = true
edition.workspace = true

[dependencies]
nexdesk-proto = { path = "../nexdesk-proto" }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
