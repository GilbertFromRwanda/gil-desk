syntax = "proto3";

package nexdesk.v1;

option go_package = "github.com/nexdesk/nexdesk/backend/gen/nexdesk/v1;nexdeskv1";

// Device registration, presence/heartbeat, peer lookup, and session
// authorization (planner tasks G-08..G-12).
service RendezvousService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc LookupPeer(LookupPeerRequest) returns (LookupPeerResponse);
  rpc AuthorizeDevice(AuthorizeDeviceRequest) returns (AuthorizeDeviceResponse);
  rpc RequestSession(RequestSessionRequest) returns (RequestSessionResponse);
}

message RegisterDeviceRequest {
  string device_id = 1;
  string public_key = 2;
}

message RegisterDeviceResponse {
  bool accepted = 1;
}

// Refreshes a device's presence TTL and records where it can currently be
// reached, so a later LookupPeer can hand that endpoint to a would-be
// direct connection attempt (planner Section 7 "Attempt direct connection
// -> if direct fails -> relay").
message HeartbeatRequest {
  string device_id = 1;
  string endpoint = 2;
}

message HeartbeatResponse {
  bool accepted = 1;
  uint32 ttl_seconds = 2;
}

message LookupPeerRequest {
  string device_id = 1;
}

message LookupPeerResponse {
  bool found = 1;
  string public_key = 2;
  bool online = 3;
  string endpoint = 4; // only set when online
}

// Grants allowed_device_id permission to request a session with
// owner_device_id. Stands in for a real pairing UI/account model
// (G-13..G-19, not built yet) — for now this is the only way to populate
// the authorization list.
message AuthorizeDeviceRequest {
  string owner_device_id = 1;
  string allowed_device_id = 2;
}

message AuthorizeDeviceResponse {
  bool accepted = 1;
}

// Checks the authorization list and, if allowed, issues a short-lived
// signed session token — proof for a relay or the target device that the
// rendezvous server already authorized this pairing, without either of
// them needing their own database round trip (planner task G-12).
message RequestSessionRequest {
  string requester_device_id = 1;
  string target_device_id = 2;
}

message RequestSessionResponse {
  bool authorized = 1;
  string session_token = 2; // empty when not authorized
  uint32 expires_in_seconds = 3;
}
